apply plugin: "java"
apply plugin: "war"

sourceCompatibility = 1.8
sourceSets.main.java.srcDirs = ["src/"]

configurations.configureEach {
    exclude group: 'com.google.gwt', module: 'gwt-user'
    exclude group: 'com.google.gwt', module: 'gwt-dev'
    exclude group: 'com.google.gwt', module: 'gwt-servlet'
}

def gwtOutput = layout.buildDirectory.dir('gwt/out')
def gaineaSourceDirs = files(
        file('src'),
        project(':client').file('src'),
        project(':shared').file('src/main/java'),
        project(':shared').layout.buildDirectory.dir('generated/source/proto/main/java'),
        project(':server').file('src/main'))

tasks.register('compileGwt', JavaExec) {
    group = 'build'
    description = 'Compiles the Gainea browser client with GWT.'
    dependsOn classes, ':shared:generateProto'
    mainClass = 'com.google.gwt.dev.Compiler'
    classpath = gaineaSourceDirs + sourceSets.main.runtimeClasspath
    args '-war', gwtOutput.get().asFile.absolutePath,
            '-style', 'PRETTY',
            '-strict',
            'com.broll.gainea.GdxDefinition'
    maxHeapSize = '2G'
}

tasks.register('draftCompileGwt', JavaExec) {
    group = 'build'
    description = 'Quickly compiles the Gainea browser client with GWT.'
    dependsOn classes, ':shared:generateProto'
    mainClass = 'com.google.gwt.dev.Compiler'
    classpath = gaineaSourceDirs + sourceSets.main.runtimeClasspath
    args '-war', gwtOutput.get().asFile.absolutePath,
            '-style', 'PRETTY',
            '-draftCompile',
            '-strict',
            'com.broll.gainea.GdxDefinition'
    maxHeapSize = '2G'
}

tasks.register('dist', Sync) {
    dependsOn compileGwt
    into layout.buildDirectory.dir('dist')
    from gwtOutput
    from 'webapp'
}
