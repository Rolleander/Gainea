apply plugin: "java"
apply plugin: "war"

sourceCompatibility = 1.8
sourceSets.main.java.srcDirs = ["src/"]
// java.* super-source is consumed by GWT, but javac must not compile it as part of java.base.
sourceSets.main.java.exclude "com/broll/gainea/super/java/**"

configurations.configureEach {
    exclude group: 'com.google.gwt', module: 'gwt-user'
    exclude group: 'com.google.gwt', module: 'gwt-dev'
    exclude group: 'com.google.gwt', module: 'gwt-servlet'
}

def gwtOutput = layout.buildDirectory.dir('gwt/out')
def gaineaSourceDirs = files(
        file('src'),
        project(':client').file('src'),
        project(':shared').file('src/main/java'),
        project(':shared').layout.buildDirectory.dir('generated/source/proto/main/java'))

tasks.register('compileGwt', JavaExec) {
    group = 'build'
    description = 'Compiles the Gainea browser client with GWT.'
    dependsOn classes, ':shared:generateProto'
    mainClass = 'com.google.gwt.dev.Compiler'
    classpath = gaineaSourceDirs + sourceSets.main.runtimeClasspath
    args '-war', gwtOutput.get().asFile.absolutePath,
            '-style', 'PRETTY',
            '-strict',
            'com.broll.gainea.GdxDefinition'
    maxHeapSize = '2G'
}

tasks.register('draftCompileGwt', JavaExec) {
    group = 'build'
    description = 'Quickly compiles the Gainea browser client with GWT.'
    dependsOn classes, ':shared:generateProto'
    mainClass = 'com.google.gwt.dev.Compiler'
    classpath = gaineaSourceDirs + sourceSets.main.runtimeClasspath
    args '-war', gwtOutput.get().asFile.absolutePath,
            '-style', 'PRETTY',
            '-draftCompile',
            '-strict',
            'com.broll.gainea.GdxDefinition'
    maxHeapSize = '2G'
}

tasks.register('dist', Sync) {
    dependsOn compileGwt
    into layout.buildDirectory.dir('dist')
    from gwtOutput
    // The libGDX preloader generator writes its hashed assets and manifest here.
    from 'war'
    from 'webapp'
}

tasks.register('serve', Exec) {
    group = 'application'
    description = 'Builds and serves the GWT distribution over HTTP.'
    dependsOn dist

    def httpPort = providers.gradleProperty('httpPort').orElse('8088')
    workingDir layout.buildDirectory.dir('dist')
    commandLine 'python3', '-m', 'http.server', httpPort.get(), '--bind', '127.0.0.1'

    doFirst {
        logger.lifecycle("Serving Gainea at http://localhost:${httpPort.get()}")
        logger.lifecycle('Press Ctrl+C to stop the server.')
    }
}
